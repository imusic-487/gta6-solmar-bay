<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a2836; font-family: system-ui, sans-serif; }
  #game-container { position: fixed; inset: 0; }
  #game-container canvas { display: block; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 24px; padding: 12px 18px; color: #fff; font-weight: 700; font-size: 18px; text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none; z-index: 5; }
  #hud span { background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 6px; }
  #minimap { position: fixed; right: 14px; bottom: 14px; border: 2px solid rgba(255,255,255,.6); border-radius: 50%; background: rgba(10,20,30,.8); z-index: 5; }
  #title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,18,28,.72); color: #fff; z-index: 10; text-align: center; }
  #title h1 { font-size: 64px; margin: 0 0 8px; letter-spacing: 4px; color: #ffd27a; text-shadow: 0 2px 18px rgba(255,170,60,.5); }
  #title p { font-size: 20px; margin: 0 0 28px; color: #e8ecf1; }
  #help { list-style: none; padding: 0; margin: 0; font-size: 17px; line-height: 1.9; color: #dfe6ee; }
  #help li b { color: #ffd27a; }
  #title .hint { margin-top: 28px; font-size: 15px; color: #9fb0c3; }
  #title-buttons { display: flex; gap: 16px; margin-top: 28px; }
  #title-buttons button { font-size: 20px; font-weight: 700; padding: 12px 32px; border-radius: 8px; border: 0; cursor: pointer; }
  #continue-btn { background: #ffd27a; color: #1a2836; }
  #newgame-btn { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.45); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js"
  }
}
</script>
</head>
<body>
<div id="game-container"></div>
<div id="hud">
  <span id="cash">$0</span>
  <span id="stars">☆☆☆☆☆</span>
  <span id="objective">Welcome to Solmar Bay</span>
</div>
<canvas id="minimap" width="180" height="180"></canvas>
<div id="title">
  <h1>Solmar Bay</h1>
  <p>Sun, salt air, and one long golden hour to make your name.</p>
  <ul id="help">
    <li><b>WASD</b> — move</li>
    <li><b>Mouse drag</b> — camera</li>
    <li><b>Shift</b> — run</li>
    <li><b>Space</b> — jump</li>
    <li><b>E</b> — interact</li>
    <li><b>M</b> — mute</li>
  </ul>
  <div id="title-buttons">
    <button id="continue-btn" type="button" style="display:none">Continue</button>
    <button id="newgame-btn" type="button">New Game</button>
  </div>
  <div class="hint">Click anywhere to start</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
